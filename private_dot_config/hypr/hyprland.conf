autogenerated = 0 # remove this line to remove the warning

# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# MONITORS
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto


# USUAL PROGRAMS
# See https://wiki.hyprland.org/Configuring/Keywords/
# Set programs that you use
$terminal = kitty
$explorer = /home/yardrat/.local/bin/zen
$note = zettlr
$menu = wofi --show drun


# AUTOSTART
# Autostart necessary processes
# Or execute your favorite apps at launch like this:
exec-once = fcitx5 -d
exec-once = /home/yardrat/.local/bin/batterynotify.sh
exec-once = swaybg -i /home/yardrat/Workbench/Imgs/Waifu/Lapwing_Darken_CLI.png -m fill

# ENVIRONMENT VARIABLES
# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1
env = _JAVA_AWT_WM_NONREPARENTING,1



# LOOK AND FEEL
# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 0.98
    inactive_opacity = 0.9

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.3 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT

# Move focus with mainMod + IJKL
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# See https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, P, exec, $terminal
bind = $mainMod, U, exec, $explorer
bidn = $mainMod, O, exec, $note
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, P, exec, /home/yardrat/.local/bin/screenshot.sh
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, U, exec, /home/yardrat/.local/bin/vol_down.sh
bind = $mainMod SHIFT, I, exec, /home/yardrat/.local/bin/vol_up.sh
bind = $mainMod SHIFT, M, exec, /home/yardrat/.local/bin/vol_zero.sh

# Toggle input method (Chinese/English)
bind = $mainMod, space, exec, fcitx5-remote -t

# bind = $mainMod, E, togglefloating,
# bind = $mainMod, U, togglesplit, # dwindle

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# ── Float rules ──
windowrule { name = float-pavucontrol;        match:class = pavucontrol;                     float = yes }
windowrule { name = float-mediaviewer;        match:title = Media viewer;                    float = yes }
windowrule { name = float-volumecontrol;      match:title = Volume Control;                   float = yes }
windowrule { name = float-pip;                 match:title = Picture-in-Picture;               float = yes }
windowrule { name = float-devtools;           match:title = DevTools;                          float = yes }
windowrule { name = float-fileprogress;       match:class = file_progress;                     float = yes }
windowrule { name = float-confirm;            match:class = confirm;                           float = yes }
windowrule { name = float-dialog;             match:class = dialog;                            float = yes }
windowrule { name = float-download;           match:class = download;                          float = yes }
windowrule { name = float-notification;       match:class = notification;                      float = yes }
windowrule { name = float-error;              match:class = error;                             float = yes }
windowrule { name = float-openfile;           match:title = Open File;                         float = yes }
windowrule { name = float-confirmreplace;     match:title = Confirm to replace files;          float = yes }
windowrule { name = float-fileprogress-title; match:title = File Operation Progress;           float = yes }

# Size for float dialogs
windowrule { name = size-download;  match:class = download;      size = 800 600 }
windowrule { name = size-openfile;  match:title = Open File;     size = 800 600 }
windowrule { name = size-volume;    match:title = Volume Control; size = 640 400 }
