# ── Background ──
background {
    monitor =
    path = /home/yardrat/Workbench/Imgs/Waifu/Lapwing_Darken_CLI.png
    blur_passes = 1
    blur_size = 3
    color = rgba(40, 44, 52, 0.6)
}

# ── Time ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(97, 175, 239, 1.0)
    font_size = 80
    font_family = MapleMonoNL-NFMono-CN-Regular
    position = 0, -80
    halign = center
    valign = center
}

# ── Date ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(171, 178, 191, 1.0)
    font_size = 24
    font_family = MapleMonoNL-NFMono-CN-Regular
    position = 0, -20
    halign = center
    valign = center
}

# ── Password Input ──
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(97, 175, 239, 0.8)
    inner_color = rgba(40, 44, 52, 0.8)
    font_color = rgba(171, 178, 191, 1.0)
    fade_on_empty = true
    rounding = 10
    hide_input = false
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = Input password
    color = rgba(224, 108, 117, 1.0)
    font_size = 18
    font_family = MapleMonoNL-NFMono-CN-Regular
    position = 0, 120
    halign = center
    valign = center
}
